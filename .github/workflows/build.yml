
name: Build CloudWin IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project CloudWin.xcodeproj \
            -scheme CloudWin \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CloudWin.app Payload/
          zip -r CloudWin.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CloudWin-unsigned-IPA
          path: CloudWin.ipa
          if-no-files-found: error
