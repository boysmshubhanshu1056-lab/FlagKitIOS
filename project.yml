name: FlagKitIOS
options:
  bundleIdPrefix: com.flagkit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "FlagKit iOS"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
targets:
  FlagKitIOS:
    type: application
    platform: iOS
    sources:
      - path: FlagKitIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flagkit.ios
        PRODUCT_NAME: FlagKitIOS
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
