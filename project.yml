
name: CloudWin

options:
  bundleIdPrefix: com.cloudwin
  deploymentTarget:
    iOS: "16.0"

targets:
  CloudWin:
    type: application
    platform: iOS
    sources:
      - ContentView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudwin.launcher
        PRODUCT_NAME: CloudWin
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CloudWin
